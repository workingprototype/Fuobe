# Builds each push to main on GitHub's runners and sends the build to the server, which installs it.
#
# Two jobs, so the server's key never meets the code that builds:
# - build: no secrets. Installs, typechecks, builds, packs .next with scripts/pack-build.sh, and keeps the
#   archive for a week. It holds only compiled code from this public repository: no node_modules, data or env.
# - deploy: only for pushes to main of this repository, in the "production" environment, whose secrets only
#   it can read. It runs no code from the repository: it downloads the archive, checks its sha256, and sends it
#   over SSH. Its log says only whether the delivery worked.
# The key only hands the file over. The server installs it only when GitHub's own record of this run's artifact
# has the same sha256, so the key alone can't put code on the site.
#
# Secrets (environment "production"): FUOBE_DEPLOY_TARGET (user@host:port), FUOBE_DEPLOY_KEY (private key),
# FUOBE_DEPLOY_KNOWN_HOSTS (the server's host key line).
# A manual run (workflow_dispatch) builds and checks any branch. It never deploys, and never cancels a push's run.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'workingprototype/Fuobe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Set up pnpm (the version package.json names)
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec next typegen && pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Pack
        id: pack
        env:
          COMMIT: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::The checkout is not the pushed commit."; exit 1; }
          scripts/pack-build.sh "$RUNNER_TEMP/fuobe-build.tar.zst"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/fuobe-build.tar.zst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/fuobe-build.tar.zst
          archive: false
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'workingprototype/Fuobe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuobe-build.tar.zst
          path: ${{ runner.temp }}/build

      - name: Check the build
        env:
          COMMIT: ${{ github.sha }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if ! [[ $COMMIT =~ ^[0-9a-f]{40}$ && $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The build job gave no checksum."
            exit 1
          fi
          mapfile -t found < <(find "$RUNNER_TEMP/build" -type f -name fuobe-build.tar.zst)
          if [ "${#found[@]}" != 1 ]; then
            echo "::error::The download holds ${#found[@]} builds, not one."
            exit 1
          fi
          mv "${found[0]}" "$RUNNER_TEMP/fuobe-build.tar.zst"
          if ! echo "$SHA256  $RUNNER_TEMP/fuobe-build.tar.zst" | sha256sum --check --status; then
            echo "::error::The downloaded build doesn't match the build job's checksum."
            exit 1
          fi
          echo "The build matches its checksum."

      # Prints nothing about the server: not its address, user, port or answers. ssh's own messages go nowhere.
      - name: Deliver
        env:
          COMMIT: ${{ github.sha }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          DEPLOY_TARGET: ${{ secrets.FUOBE_DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.FUOBE_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.FUOBE_DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DEPLOY_TARGET" ] || missing+=" FUOBE_DEPLOY_TARGET"
          [ -n "$DEPLOY_KEY" ] || missing+=" FUOBE_DEPLOY_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing+=" FUOBE_DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the production environment:$missing"
            exit 1
          fi
          # One secret for user, host and port: a short one, such as a port number alone, would be masked inside
          # unrelated numbers in this public log, and so show what it is.
          target_re='^([a-z_][a-z0-9_-]{0,31})@([A-Za-z0-9][A-Za-z0-9.-]*|\[[0-9A-Fa-f:]+\]):([0-9]{1,5})$'
          if ! [[ $DEPLOY_TARGET =~ $target_re ]]; then
            echo "::error::FUOBE_DEPLOY_TARGET is not user@host:port."
            exit 1
          fi
          user=${BASH_REMATCH[1]}
          host=${BASH_REMATCH[2]}
          port=${BASH_REMATCH[3]}
          host=${host#\[}
          host=${host%\]}

          # The key exists only for this step, readable by this user only.
          umask 077
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keys/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$keys/known_hosts"

          set +e
          answer=$(ssh -F /dev/null -q -o LogLevel=ERROR -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keys/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no -o IdentitiesOnly=yes -o IdentityFile="$keys/id" -o IdentityAgent=none \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ClearAllForwardings=yes \
            -o ForwardAgent=no -o ForwardX11=no -o RequestTTY=no \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$port" -l "$user" -- "$host" "deliver $COMMIT $SHA256" \
            < "$RUNNER_TEMP/fuobe-build.tar.zst" 2> /dev/null)
          status=$?
          set -e
          rm -rf "$keys"

          case "$status:$answer" in
            0:ok) echo "Delivered. The server installs it within a few minutes." ;;
            *:refused) echo "::error::The server refused the build. Its journal says why."; exit 1 ;;
            255:*) echo "::error::Couldn't reach the server, or it didn't accept the host key or the deploy key."; exit 1 ;;
            *) echo "::error::The delivery failed."; exit 1 ;;
          esac
